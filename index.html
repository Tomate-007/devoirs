<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mes devoirs</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Devoirs">
<meta name="theme-color" content="#6d4aff">
<style>
:root{--bg:#f4f3fb;--card:#ffffff;--tx:#1f1d33;--mut:#6e6b85;--ac:#6d4aff;--acx:#ffffff;--bd:#e5e2f5;--red:#d6336c;--grn:#12a37f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
:root[data-theme="dark"]{--bg:#14131f;--card:#1e1c2e;--tx:#eeedf8;--mut:#9d9ab8;--ac:#9b82ff;--acx:#14101f;--bd:#2f2c45;--red:#ff7aa8;--grn:#4fd8b4;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:980px;margin:0 auto;padding:72px 14px 30px}
h1{font-size:22px;margin:4px 0 2px}h2{font-size:17px;margin:20px 0 8px}
.sub{color:var(--mut);font-size:14px;margin:0 0 12px}
nav{position:fixed;left:0;right:0;top:0;z-index:10;display:flex;background:var(--card);border-bottom:1px solid var(--bd);padding-top:env(safe-area-inset-top,0px)}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:12px 4px;font:inherit;font-size:13px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:14px;margin:4px 2px}
nav button.on{color:var(--ac);font-weight:600;background:color-mix(in srgb,var(--ac) 14%,transparent)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px;margin:8px 0;box-shadow:0 1px 3px rgba(60,40,140,.07);border-left:4px solid hsl(var(--h,255) 65% 62%)}
input,select,textarea,button.b{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:8px 10px;width:100%}
textarea{min-height:90px;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1 1 140px}
button.b{width:auto;cursor:pointer;background:var(--card)}
button.p{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:600;box-shadow:0 3px 8px color-mix(in srgb,var(--ac) 30%,transparent)}
button.x{border:0;background:none;color:var(--mut);cursor:pointer;font-size:18px;width:auto;padding:0 6px}
.t{display:flex;gap:10px;align-items:flex-start}.t input[type=checkbox]{width:22px;height:22px;margin-top:3px;flex:none;accent-color:var(--ac)}
.t .m{flex:1;min-width:0}.t.d .ti{text-decoration:line-through;color:var(--mut)}
.ti{font-weight:600;overflow-wrap:anywhere}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;background:hsl(var(--h,255) 80% 94%);color:hsl(var(--h,255) 45% 32%);border:0;font-weight:500;margin-right:4px}
:root[data-theme="dark"] .tag{background:hsl(var(--h,255) 35% 25%);color:hsl(var(--h,255) 80% 86%)}
.late{color:var(--red)}.soon{color:var(--grn)}
.fiche{white-space:normal;overflow-wrap:anywhere}
.fiche h3{font-size:16px;margin:12px 0 4px}.fiche ul{margin:4px 0;padding-left:20px}
.empty{color:var(--mut);text-align:center;padding:24px 8px}
.st{color:var(--mut);font-size:14px;min-height:20px}
a{color:var(--ac)}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dy{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:6px;min-height:130px}
.dy.now{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac);background:color-mix(in srgb,var(--ac) 9%,var(--card))}
.dy h4{margin:0 0 6px;font-size:13px;text-transform:capitalize}
.ch{display:flex;gap:6px;align-items:flex-start;font-size:13px;padding:5px;border-radius:6px;background:var(--bg);margin-top:4px;border-left:3px solid hsl(var(--h,255) 65% 62%);overflow-wrap:anywhere}
.ch.p2{border-left-color:var(--red)}.ch.d{opacity:.5;text-decoration:line-through}
.ch input{width:16px;height:16px;margin-top:2px;flex:none}
.ch small{display:block;color:var(--mut)}
@media(max-width:700px){.wk{grid-template-columns:1fr}.dy{min-height:0}}
summary{list-style:none}summary::-webkit-details-marker{display:none}
.fc summary{display:flex;gap:10px;align-items:center;cursor:pointer}
.fc .chev{transition:transform .15s;font-size:24px;color:var(--mut);line-height:1}
.fc[open] .chev{transform:rotate(90deg)}
.fc .fiche{margin-top:10px;border-top:1px solid var(--bd);padding-top:6px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-4px;flex:none}
.tag .ic{width:12px;height:12px;vertical-align:-2px}
summary .ic{width:18px;height:18px}
label.b{display:block;text-align:center;font:inherit;font-weight:600;padding:8px 10px;border:1px solid var(--ac);border-radius:10px;color:var(--acx);background:var(--ac);cursor:pointer;width:auto;box-shadow:0 3px 8px color-mix(in srgb,var(--ac) 30%,transparent)}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.pill-btn{font-size:12px;padding:5px 10px;border-radius:999px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav"></nav>

        display:"standalone",
        background_color:"#6d4aff",
        theme_color:"#6d4aff",
        icons:[{src:iconUrl,sizes:"512x512",type:"image/png"}]
      };
      var mBlob=new Blob([JSON.stringify(manifest)],{type:"application/manifest+json"});
      var mLink=document.createElement("link");mLink.rel="manifest";mLink.href=URL.createObjectURL(mBlob);

      if("serviceWorker" in navigator){

        navigator.serviceWorker.register(swUrl).catch(function(){});
      }
    }
  }catch(e){}
}

</body>
</html>
