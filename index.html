 <link rel="manifest" href="./manifest.json">

<style>
:root{--bg:#f4f3fb;--card:#fff;--tx:#1f1d33;--mut:#6e6b85;--ac:#6d4aff;--acx:#fff;--bd:#e5e2f5;--red:#d6336c;--grn:#12a37f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14131f;--card:#1e1c2e;--tx:#eeedf8;--mut:#9d9ab8;--ac:#9b82ff;--acx:#14101f;--bd:#2f2c45;--red:#ff7aa8;--grn:#4fd8b4;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14131f;--card:#1e1c2e;--tx:#eeedf8;--mut:#9d9ab8;--ac:#9b82ff;--acx:#14101f;--bd:#2f2c45;--red:#ff7aa8;--grn:#4fd8b4;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:980px;margin:0 auto;padding:64px 14px 30px}
h1{font-size:22px;margin:4px 0 2px}h2{font-size:17px;margin:20px 0 8px}
.sub{color:var(--mut);font-size:14px;margin:0 0 12px}
nav{position:fixed;left:0;right:0;top:0;z-index:10;display:flex;background:var(--card);border-bottom:1px solid var(--bd);padding-top:env(safe-area-inset-top,0px)}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:12px 4px;font:inherit;font-size:13px;cursor:pointer}
nav button.on{color:var(--ac);font-weight:600}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:8px 0}
input,select,textarea,button.b{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;width:100%}
textarea{min-height:90px;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1 1 140px}
button.b{width:auto;cursor:pointer;background:var(--card)}
button.p{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:600}
button.x{border:0;background:none;color:var(--mut);cursor:pointer;font-size:18px;width:auto;padding:0 6px}
.t{display:flex;gap:10px;align-items:flex-start}.t input[type=checkbox]{width:22px;height:22px;margin-top:3px;flex:none}
.t .m{flex:1;min-width:0}.t.d .ti{text-decoration:line-through;color:var(--mut)}
.ti{font-weight:600;overflow-wrap:anywhere}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;background:var(--bg);border:1px solid var(--bd);color:var(--mut);margin-right:4px}
.late{color:var(--red)}.soon{color:var(--grn)}
.fiche{white-space:normal;overflow-wrap:anywhere}
.fiche h3{font-size:16px;margin:12px 0 4px}.fiche ul{margin:4px 0;padding-left:20px}
.empty{color:var(--mut);text-align:center;padding:24px 8px}
.st{color:var(--mut);font-size:14px;min-height:20px}
a{color:var(--ac)}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dy{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:6px;min-height:130px}
.dy.now{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac)}
.dy h4{margin:0 0 6px;font-size:13px;text-transform:capitalize}
.ch{display:flex;gap:6px;align-items:flex-start;font-size:13px;padding:5px;border-radius:6px;background:var(--bg);margin-top:4px;border-left:3px solid var(--ac);overflow-wrap:anywhere}
.ch.p2{border-left-color:var(--red)}.ch.d{opacity:.5;text-decoration:line-through}
.ch input{width:16px;height:16px;margin-top:2px;flex:none}
.ch small{display:block;color:var(--mut)}
@media(max-width:700px){.wk{grid-template-columns:1fr}.dy{min-height:0}}
summary{list-style:none}summary::-webkit-details-marker{display:none}
body{background:linear-gradient(180deg,color-mix(in srgb,var(--ac) 12%,var(--bg)),var(--bg) 240px) no-repeat var(--bg)}
h1{font-size:27px;letter-spacing:-.02em}
input[type=checkbox]{accent-color:var(--ac)}
.card{border-radius:16px;box-shadow:0 1px 3px rgba(60,40,140,.07);border-left:4px solid hsl(var(--h,255) 65% 62%)}
.tag{background:hsl(var(--h,255) 80% 94%);color:hsl(var(--h,255) 45% 32%);border:0;font-weight:500}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .tag{background:hsl(var(--h,255) 35% 25%);color:hsl(var(--h,255) 80% 86%)}}
:root[data-theme="dark"] .tag{background:hsl(var(--h,255) 35% 25%);color:hsl(var(--h,255) 80% 86%)}
button.p{box-shadow:0 3px 8px color-mix(in srgb,var(--ac) 30%,transparent)}
input,select,textarea,button.b{border-radius:10px}
nav button{border-radius:14px;margin:4px 2px}
nav button.on{background:color-mix(in srgb,var(--ac) 14%,transparent)}
.dy{border-radius:14px}.dy.now{background:color-mix(in srgb,var(--ac) 9%,var(--card))}
.ch{border-left-color:hsl(var(--h,255) 65% 62%)}
.fc summary{display:flex;gap:10px;align-items:center;cursor:pointer}
.fc .chev{transition:transform .15s;font-size:24px;color:var(--mut);line-height:1}
.fc[open] .chev{transform:rotate(90deg)}
.fc .fiche{margin-top:10px;border-top:1px solid var(--bd);padding-top:6px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-4px;flex:none}
.tag .ic{width:12px;height:12px;vertical-align:-2px}
nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px}
summary .ic{width:18px;height:18px}
label.b{display:block;text-align:center;font:inherit;font-weight:600;padding:8px 10px;border:1px solid var(--ac);border-radius:10px;color:var(--acx);background:var(--ac);cursor:pointer;width:auto;box-shadow:0 3px 8px color-mix(in srgb,var(--ac) 30%,transparent)}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav"></nav>
<script>
var KEY="devoirs-v1",GEMINI_KEY_STORAGE="gemini-api-key-v1",GEMINI_MODEL="gemini-3.5-flash-lite";
var S={tasks:[],courses:[],fiches:[],links:[]},tab="devoirs",busy="",pend=[],lo=false,openF={},weekOff=0;
var TABS=[["devoirs","Devoirs"],["agenda","Agenda"],["cours","Cours"],["fiches","Fiches"]];
try{var r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
var dbR=null,syncLabel="",pushT=null;
function setSync(s){syncLabel=s;var e=document.getElementById("syn");if(e)e.innerHTML=s}
function save(){S.ts=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(dbR){clearTimeout(pushT);pushT=setTimeout(push,700)}}
function parts(){return{core:{tasks:S.tasks,links:S.links},courses:{courses:S.courses},fiches:{fiches:S.fiches}}}
async function push(){if(!dbR)return;try{var P=parts();await Promise.all(Object.keys(P).map(function(k){return dbR[k].set({json:JSON.stringify(P[k]),ts:S.ts})}));setSync(ico("cloud")+" Synchronisé avec ton compte")}catch(e){setSync("Sauvegarde en ligne impossible"+(e&&e.code==="quota_exceeded"?" (espace plein)":""))}}
async function pull(){if(!dbR)return;try{var K=Object.keys(dbR),sn=await Promise.all(K.map(function(k){return dbR[k].get()})),R={},ts=0,any=false;
 sn.forEach(function(s){if(s.exists){var d=s.data();any=true;ts=Math.max(ts,d.ts||0);Object.assign(R,JSON.parse(d.json))}});
 if(any&&ts>(S.ts||0)){S=Object.assign({tasks:[],courses:[],fiches:[],links:[]},R,{ts:ts});try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}render()}else if(!any||ts<(S.ts||0)){await push();return}
 setSync(ico("cloud")+" Synchronisé avec ton compte")}catch(e){setSync("Sauvegarde en ligne indisponible")}}
async function initSync(){var loc="Mode local : données sur cet appareil";try{var u=window.claude&&await claude.use("user"),db=window.claude&&await claude.use("db");if(!u||!db){setSync(loc);return}var id=await u.id();if(!id){setSync(loc);return}var b="data/users/"+id+"/";dbR={core:db.doc(b+"core"),courses:db.doc(b+"courses"),fiches:db.doc(b+"fiches")};await pull();document.addEventListener("visibilitychange",function(){if(!document.hidden)pull()})}catch(e){setSync(loc)}}
function icons(){try{var c=document.createElement("canvas");c.width=c.height=512;var x=c.getContext("2d"),g=x.createLinearGradient(0,0,512,512);g.addColorStop(0,"#8b6bff");g.addColorStop(1,"#5a36e6");x.fillStyle=g;x.fillRect(0,0,512,512);x.translate(256,256);x.scale(14,14);x.translate(-12,-12);x.strokeStyle="#fff";x.lineWidth=1.8;x.lineCap=x.lineJoin="round";x.stroke(new Path2D("M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"));x.stroke(new Path2D("M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"));var u=c.toDataURL("image/png");["apple-touch-icon","icon"].forEach(function(r){var l=document.createElement("link");l.rel=r;l.href=u;document.head.appendChild(l)})}catch(e){}}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
var IC={devoirs:'<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>',agenda:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',cours:'<path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3z"/><circle cx="12" cy="13" r="3"/>',fiches:'<path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/>',link:'<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>',alert:'<circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/>',down:'<path d="m6 9 6 6 6-6"/>',right:'<path d="m9 18 6-6-6-6"/>',cloud:'<path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/>'};
function ico(n){return'<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">'+IC[n]+'</svg>'}
function hue(s){if(!s)return 255;var h=7;s=s.toLowerCase().trim();for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))%360;return h}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
var TODAY=iso(new Date());
function days(a,b){return Math.round((new Date(b+"T00:00")-new Date(a+"T00:00"))/864e5)}
function fmt(d){return new Date(d+"T00:00").toLocaleDateString("fr-FR",{weekday:"short",day:"numeric",month:"short"})}
function rel(d){var n=days(TODAY,d);return n<0?"en retard ("+(-n)+" j)":n==0?"aujourd’hui":n==1?"demain":"dans "+n+" j"}
function cls(t){if(t.done)return"";var n=days(TODAY,t.date);return n<0?"late":n<=1?"soon":""}
function sorted(a){return a.slice().sort(function(x,y){return(x.done-y.done)||(x.date||"9").localeCompare(y.date||"9")||(y.prio-x.prio)})}
function links(s){return esc(s).replace(/(https?:\/\/[^\s]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>')}
function md(s){var h="",o=false;esc(s).split("\n").forEach(function(l){
 var li=/^\s*[-*•]\s+(.*)/.exec(l),hd=/^#{1,4}\s+(.*)/.exec(l);
 if(li){if(!o){h+="<ul>";o=true}h+="<li>"+li[1]+"</li>";return}
 if(o){h+="</ul>";o=false}
 if(hd)h+="<h3>"+hd[1]+"</h3>";else if(l.trim())h+="<p style='margin:6px 0'>"+l+"</p>"});
 if(o)h+="</ul>";return h.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>")}
function taskHTML(t){return '<div class="card t '+(t.done?"d":"")+'" style="--h:'+hue(t.subject)+'"><input type="checkbox" '+(t.done?"checked":"")+' data-a="tog" data-id="'+t.id+'" aria-label="Fait"><div class="m"><div class="ti">'+esc(t.title)+'</div><div><span class="tag">'+esc(t.subject||"Autre")+'</span>'+(t.prio==2?'<span class="tag">'+ico("alert")+' urgent</span>':t.prio==0?'<span class="tag">faible</span>':'')+(t.date?'<span class="'+cls(t)+'">'+fmt(t.date)+' · '+rel(t.date)+'</span>':'')+'</div>'+(t.notes?'<div class="sub" style="margin:4px 0 0">'+links(t.notes)+'</div>':'')+'</div><button class="x" data-a="del" data-id="'+t.id+'" aria-label="Supprimer">×</button></div>'}
function vDevoirs(){
 var open=S.tasks.filter(function(t){return!t.done}),late=open.filter(function(t){return t.date&&t.date<TODAY}).length,td=open.filter(function(t){return t.date===TODAY}).length;
 var h='<h1>Mes devoirs</h1><p class="sub">'+open.length+' à faire · '+td+' pour aujourd’hui · <span class="'+(late?"late":"")+'">'+late+' en retard</span></p>';h+=linksHTML();
 h+='<div class="card"><div class="row"><input id="ts" placeholder="Matière (maths, histoire…)" list="subs"><input id="tt" placeholder="Devoir à faire"></div><datalist id="subs">'+subjects().map(function(s){return'<option value="'+esc(s)+'">'}).join("")+'</datalist><div class="row" style="margin-top:8px"><input id="td" type="date" value="'+TODAY+'"><select id="tp"><option value="1">Priorité normale</option><option value="2">Urgent</option><option value="0">Faible</option></select></div><textarea id="tn" placeholder="Ressources : liens, pages du manuel, consignes…" style="margin-top:8px;min-height:60px"></textarea>'+(S.links.length?'<select data-a="plink" style="margin-top:8px"><option value="">＋ Ajouter un lien préenregistré…</option>'+S.links.map(function(l){return'<option value="'+esc(l.name+" : "+l.url)+'">'+esc(l.name)+'</option>'}).join("")+'</select>':'')+'<div class="row" style="margin-top:8px"><button class="b p" data-a="add">Ajouter</button></div></div>';
 var l=sorted(S.tasks);h+=l.length?l.map(taskHTML).join(""):'<div class="empty">Aucun devoir pour le moment</div>';
 return h}
function linksHTML(){var L=S.links;return '<details class="card" '+(lo?"open":"")+'><summary style="cursor:pointer;font-weight:600">'+ico("link")+' Mes liens ('+L.length+') '+ico("down")+'</summary>'+(L.length?L.map(function(l,i){return'<div class="t" style="margin-top:8px"><div class="m"><a href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.name)+'</a></div><button class="x" data-a="dell" data-id="'+i+'" aria-label="Supprimer">×</button></div>'}).join(""):'<p class="sub">Aucun lien pour l’instant.</p>')+'<div class="row" style="margin-top:10px"><input id="ln" placeholder="Nom (ex. Manuel de maths)"><input id="lu" placeholder="https://…" inputmode="url"></div><div class="row" style="margin-top:8px"><button class="b p" data-a="addl">Ajouter le lien</button></div></details>'}
function subjects(){var s={};S.tasks.concat(S.courses).forEach(function(x){if(x.subject)s[x.subject]=1});return Object.keys(s)}
function chip(t){return'<div class="ch p'+t.prio+(t.done?" d":"")+'" style="--h:'+hue(t.subject)+'"><input type="checkbox" '+(t.done?"checked":"")+' data-a="tog" data-id="'+t.id+'" aria-label="Fait"><span><b>'+esc(t.title)+'</b><small>'+esc(t.subject||"")+'</small></span></div>'}
function vAgenda(){
 var open=S.tasks.filter(function(t){return!t.done&&t.date}),late=open.filter(function(t){return t.date<TODAY});
 var m=new Date();m.setHours(0,0,0,0);m.setDate(m.getDate()-((m.getDay()+6)%7)+weekOff*7);var e=new Date(m);e.setDate(e.getDate()+6);
 var h='<h1>Agenda</h1><div class="row" style="margin-bottom:6px"><button class="b" data-a="wk" data-id="-1">← Précédente</button><button class="b" data-a="wk" data-id="0">Cette semaine</button><button class="b" data-a="wk" data-id="1">Suivante →</button></div><p class="sub">Semaine du '+fmt(iso(m))+' au '+fmt(iso(e))+'</p>';
 if(late.length&&weekOff==0)h+='<h2 class="late">En retard</h2>'+sorted(late).map(taskHTML).join("");
 h+='<div class="wk" style="margin-top:10px">';
 for(var i=0;i<7;i++){var d=new Date(m);d.setDate(m.getDate()+i);var k=iso(d),l=sorted(S.tasks.filter(function(t){return t.date===k}));
  h+='<div class="dy'+(k===TODAY?" now":"")+'"><h4>'+d.toLocaleDateString("fr-FR",{weekday:"short",day:"numeric",month:"short"})+'</h4>'+(l.length?l.map(chip).join(""):'<div class="sub" style="font-size:12px">—</div>')+'</div>'}
 h+='</div>';
 h+='<h2>Rappels & synchronisation</h2><div class="card"><p class="sub">Exporte un fichier .ics et importe-le dans Google Agenda ou l’agenda du téléphone : tu auras des notifications la veille à 18 h et le jour même à 7 h, même app fermée.</p><div class="row"><button class="b p" data-a="ics">Exporter vers mon agenda (.ics)</button><label class="b" style="text-align:center;cursor:pointer">Importer un .ics<input type="file" accept=".ics,text/calendar" data-a="impics" hidden></label></div><div class="st" id="st"></div></div>';
 return h}
function vCours(){
 var h='<h1>Numériser un cours</h1><p class="sub">Prends en photo tes pages de cours : le texte est extrait automatiquement (modifiable), puis tu crées des fiches à la demande.</p>';
 h+='<div class="card"><div class="row"><input id="cs" placeholder="Matière" list="subs"><input id="ct" placeholder="Titre du cours"></div><div class="row" style="margin-top:8px"><label class="b" style="text-align:center;cursor:pointer">'+ico("cours")+' Photos / scans<input type="file" accept="image/*" multiple data-a="pics" hidden></label><button class="b p" data-a="ocr"'+(pend.length&&!busy?"":" disabled")+'>Extraire le texte ('+pend.length+')</button></div><div class="st">'+(busy==="ocr"?"Lecture des pages en cours…":"")+'</div><textarea id="cx" placeholder="…ou colle / tape directement ton cours ici" style="margin-top:8px;min-height:140px"></textarea><div class="row" style="margin-top:8px"><button class="b p" data-a="savec">Enregistrer le cours</button></div></div>';
 h+='<h2>Mes cours</h2>';
 h+=S.courses.length?S.courses.slice().reverse().map(function(c){return'<div class="card" style="--h:'+hue(c.subject)+'"><div class="t"><div class="m"><div class="ti">'+esc(c.title)+'</div><span class="tag">'+esc(c.subject||"Autre")+'</span><span class="sub">'+c.text.length+' caractères</span></div><button class="x" data-a="delc" data-id="'+c.id+'" aria-label="Supprimer">×</button></div><div class="row" style="margin-top:8px">'+[["resume","Résumé"],["fiche","Fiche de révision"],["cartes","Flashcards"],["quiz","Quiz"]].map(function(f){return'<button class="b" data-a="gen" data-k="'+f[0]+'" data-id="'+c.id+'"'+(busy?" disabled":"")+'>'+f[1]+'</button>'}).join("")+'</div>'+(busy==="gen"+c.id?'<div class="st">Création de la fiche…</div>':"")+'</div>'}).join(""):'<div class="empty">Aucun cours enregistré.</div>';
 return h}
function vFiches(){
 var h='<h1>Mes fiches</h1>';
 h+=S.fiches.length?S.fiches.slice().reverse().map(function(f){return'<details class="card fc" data-f="'+f.id+'" style="--h:'+hue(f.subject)+'" '+(openF[f.id]?"open":"")+'><summary><span class="chev">'+ico("right")+'</span><span class="m"><span class="ti">'+esc(f.title)+'</span><br><span class="tag">'+esc(f.kind)+'</span></span></summary><div class="fiche">'+md(f.content)+'</div><div class="row" style="margin-top:8px"><button class="b" data-a="copy" data-id="'+f.id+'">Copier</button><button class="b" data-a="dlf" data-id="'+f.id+'">Télécharger</button><button class="b" data-a="delf" data-id="'+f.id+'">Supprimer</button></div></details>'}).join(""):'<div class="empty">Crée ta première fiche depuis l’onglet Cours.</div>';
 return h}
function render(){
 document.getElementById("nav").innerHTML=TABS.map(function(t){return'<button data-a="tab" data-id="'+t[0]+'" class="'+(tab==t[0]?"on":"")+'">'+ico(t[0])+'<span>'+t[1]+'</span></button>'}).join("");
 var keep=["cs","ct","cx","ts","tt","td","tn","tp","ln","lu"].map(function(i){var e=document.getElementById(i);return[i,e?e.value:null]});

async function dl(name,data,type){

function parseICS(t){var out=[];t.replace(/\r?\n[ \t]/g,"").split("BEGIN:VEVENT").slice(1).forEach(function(b){

function shrink(f){return new Promise(function(res,rej){var u=URL.createObjectURL(f),i=new Image();i.onload=function(){var k=Math.min(1,1600/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*k;c.height=i.height*k;c.getContext("2d").drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(function(b){b?res(b):rej()},"image/jpeg",.82)};i.onerror=rej;i.src=u})}

/* --- Connexion Gemini sur Android / PWA --- */
function getGeminiKey(forceAsk){
 var k="";
 try{k=localStorage.getItem(GEMINI_KEY_STORAGE)||""}catch(e){}
 if(!k||forceAsk){
  var v=prompt("Entre ta clé API Gemini (AIza...) :",k||"");
  if(v&&v.trim()){k=v.trim();try{localStorage.setItem(GEMINI_KEY_STORAGE,k)}catch(e){}}
  else if(!k)throw{code:"missing_key"};
 }
 return k}
function blobToBase64(blob){return new Promise(function(res,rej){
 var r=new FileReader();
 r.onload=function(){res(String(r.result).split(",")[1]||"")};
 r.onerror=rej;
 r.readAsDataURL(blob)})}
async function callGemini(prompt,opts){
 opts=opts||{};
 var key=getGeminiKey(false);
 var parts=[];
 if(opts.images&&opts.images.length){
  for(var i=0;i<opts.images.length;i++){
   var b=opts.images[i],b64=await blobToBase64(b);
   parts.push({inlineData:{mimeType:b.type||"image/jpeg",data:b64}})}
 }
 parts.push({text:prompt});
 var url="https://generativelanguage.googleapis.com/v1beta/models/"+GEMINI_MODEL+":generateContent";
 var res=await fetch(url,{
  method:"POST",
  headers:{"Content-Type":"application/json","x-goog-api-key":key},
  body:JSON.stringify({contents:[{role:"user",parts:parts}]})
 });
 if(res.status===429)throw{code:"rate_limited"};
 if(res.status===400||res.status===403){
  try{localStorage.removeItem(GEMINI_KEY_STORAGE)}catch(e){}
  throw{code:"bad_key"}
 }
 if(!res.ok)throw{code:"api_"+res.status};
 var data=await res.json();
 var out=(((data.candidates||[])[0]||{}).content||{}).parts||[];
 return out.map(function(p){return p.text||""}).join("")}
async function ask(prompt,opts){
 if(window.claude){var s=await claude.use("sample");if(s)return(await s(prompt,opts||{})).text}
 return await callGemini(prompt,opts||{})}
